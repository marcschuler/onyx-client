<div class="container-list">
  <div>
    <p class="subtitle">
      Your identities are stored on this device only. Servers recognize you by its key.</p>
  </div>

  @for (identity of identityService.identities; track identity.id; let first = $first) {
    <app-identity-editor [identity]="identity" [isDefault]="first"
                         [deletable]="identityService.identities.length > 1"
                         (delete)="openIdentityDeleteDialog($event)"></app-identity-editor>
  }


  <div class="container">
    <p>Create new identity</p>
    <input id="username" class="w-full" placeholder="At least three characters" [(ngModel)]="username">
    <button class="button-main">create</button>
  </div>
</div>
