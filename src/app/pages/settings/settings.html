<div class="min-h-screen flex">
  <aside class="block min-h-screen shrink-0 bg-neutral-900 border-r-neutral-950 border-r-1 w-64">
    <div class="flex flex-col h-screen rounded">
      @for (m of menu; track m) {
        <button class="button-dark !rounded-none" (click)="selectedOption= m"
                [disabled]="selectedOption==m">{{ m.name }}
        </button>
      }
    </div>
  </aside>

  <main class="flex-1 px-8 py-4 overflow-y-scroll">
    <h1>{{ selectedOption.name }}</h1>
    <div class="pb-4"></div>
    @switch (selectedOption.id) {
      @case (SettingsOptions.GENERAL) {
        <p>Nothing to see here</p>
      }
      @case (SettingsOptions.IDENTITY) {
        <app-identity></app-identity>
      }
      @case (SettingsOptions.DEBUG){
        <app-debug></app-debug>
      }

    }
  </main>

</div>
