<ui-split-panel class="min-h-[90%]" [default]="default">
  <ui-split-panel-bar>
    <ui-split-panel-button value="General" [icon]="LucideSettings">
    </ui-split-panel-button>
    <ui-split-panel-button value="Identities" [icon]="LucideFingerprintPattern">
    </ui-split-panel-button>
    @if (connection) {
      <ui-split-panel-button value="Your Account" [name]="'Account on \'' + connection.data!.server.name + '\''"
                             [icon]="LucideIdCardLanyard">
      </ui-split-panel-button>
    }
    <ui-split-panel-divider></ui-split-panel-divider>

    @for (connection of serverLoaderService.connections; track connection) {
      <ui-split-panel-button [value]="'server-connection-' + connection.id"
                             [name]="(connection.name || connection.url)" [icon]="LucideServer">
      </ui-split-panel-button>
    }
    @if (serverLoaderService.connections.length > 0) {
      <ui-split-panel-divider></ui-split-panel-divider>
    }

    <ui-split-panel-button value="License" name="Contributors & Licences" [icon]="LucideScale">
    </ui-split-panel-button>
    <ui-split-panel-button value="Debug" [icon]="LucideBug">
    </ui-split-panel-button>
  </ui-split-panel-bar>

  <app-general splitPanel="General"></app-general>
  <app-identity splitPanel="Identities"></app-identity>

  @if (connection) {
    <app-server-user splitPanel="Your Account"
                     [connection]="connection"></app-server-user>
  }

  @for (connection of serverLoaderService.connections; track connection) {
    <app-server-editor [splitPanel]="'server-connection-' + connection.id"
                       [serverConnection]="connection"></app-server-editor>
  }

  <app-contributors splitPanel="License"></app-contributors>
  <app-debug splitPanel="Debug"></app-debug>

</ui-split-panel>
