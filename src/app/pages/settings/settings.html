<app-button-panel [buttons]="[TAB_GENERAL,TAB_IDENTITES,TAB_CONTRIBUTORS,TAB_DEBUG]"
                  [(selectedOption)]="selectedOption">
  @switch (selectedOption) {
    @case (TAB_GENERAL) {
      <app-general></app-general>
    }
    @case (TAB_IDENTITES) {
      <app-identity></app-identity>
    }
    @case (TAB_CONTRIBUTORS) {
      <app-contributors></app-contributors>
    }
    @case (TAB_DEBUG) {
      <app-debug></app-debug>
    }
  }
</app-button-panel>
