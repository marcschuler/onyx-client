<div class="pt-4">
  <label>Name</label>
  <input [(ngModel)]="name" placeholder="A custom server name">
  <label>URL</label>
  <input [(ngModel)]="url">
</div>

<div class="flex justify-end pt-4">
  <button (click)="save()">
    Save
  </button>
  <button class="button-dark button-red" (click)="openDeletePopup()">
    Delete Server
  </button>
</div>
