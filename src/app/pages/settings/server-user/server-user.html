<h3>Avatar</h3>
<div class="w-32">
  <div class="w-32">
    <div class="relative w-32 h-32 rounded-t-xl object-cover bg-neutral-800 hover:bg-neutral-700" (click)="uploadAvatar()"
         (drop)="uploadAvatar($event)">
      @if (connection.me.details.avatarId) {
        <app-preview-image class="block min-w-32 min-h-32 w-32 h-32 rounded-t-xl overflow-hidden"
                           [file]="connection.me.details.avatarId"
                           [connection]="connection">
        </app-preview-image>
      } @else {
        <lucide-icon [name]="ImageOffIcon" class="w-32 h-32 text-neutral-500"></lucide-icon>
      }
      @if (avatarUpload) {
        <p class="absolute w-full p-1 top-0 bg-onyx-800 rounded-t-xl">Uploading... {{avatarUpload.progressNice}}</p>
      }
    </div>
    <div class="flex">
      <button class="w-full button-red" [disabled]="connection.me.details.avatarId==undefined" (click)="deleteIcon()">
        <lucide-icon [name]="XIcon"></lucide-icon>
      </button>
    </div>
  </div>
</div>

<h3 class="pt-8">Invite Codes</h3>
<div class="flex">
  <input class="!rounded-r-none input-" placeholder="Enter your invite code..." [(ngModel)]="inviteCode">
  <button class="!rounded-l-none" (click)="sendInviteCode()">Send</button>
</div>
