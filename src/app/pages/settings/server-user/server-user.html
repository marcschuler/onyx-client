<h3>Avatar</h3>
<div class="w-32">
  @if (connection.me.details.avatarId) {
    <app-preview-image [file]="connection.me.details.avatarId" [connection]="connection"
                       imageClass="w-32 h-32 rounded-t-xl object-cover"></app-preview-image>
  } @else {
    <div class="w-32 h-32 rounded-t-xl object-cover border-2 border-sky-900">
      <p class="text-neutral-400 p-4 text-center">No avatar image :(</p>
    </div>
  }
  <div class="flex gap-2">
    <app-file-upload class="w-32" [connection]="connection" (uploaded)="onAvatarChange($event)"
                     [type]="UploadType.USER_AVATAR"></app-file-upload>
    <button class="py-0.5 button-red" [disabled]="connection.me.details.avatarId===undefined" (click)="deleteAvatar()">
      <lucide-icon [name]="XIcon"></lucide-icon>
    </button>
  </div>
</div>

<h3 class="pt-8">Invite Codes</h3>
<div class="flex">
  <input class="!rounded-r-none input-" placeholder="Enter your invite code..." [(ngModel)]="inviteCode">
  <button class="!rounded-l-none" (click)="sendInviteCode()">Send</button>
</div>
