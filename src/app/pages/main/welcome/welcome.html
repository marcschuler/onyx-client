<div class="flex  h-screen">
  <div class="flex flex-col shrink-0 w-112 h-full bg-neutral-950 overflow-auto px-2">

    <!-- list of server -->
    <div class="flex-1 pt-2 pb-8 gap-4 flex flex-col">
      @if (serverLoaderService.connections.length == 0) {
        <div class="text-neutral-500 py-8 px-4 text-center">
          <h3>No server</h3>
          <p>You haven't added a server yet.</p>
        </div>
      }
      @for (s of serverLoaderService.connections; track s) {
        <app-server-entry [server]="s" [selectedServer]="selectedServer" (onSelection)="connect($event)"></app-server-entry>
      }
    </div>

   <div class="shrink-0 pb-2">
     <!-- identity -->
     @if (serverLoaderService.connections.length != 0) {
       <div class="pl-2 py-2 border-b-neutral-600 border-b-1">
         Using Identity
         <select [(ngModel)]="identity">
           @for (identity of identityService.identities; track identity.id) {
             <option [value]="identity">{{ identity.username }}</option>
           }
         </select>
       </div>
     }

     <!-- new server -->
     <h4 class="pt-2">Add a server</h4>
     <div class="grid grid-cols-4">
       <input [(ngModel)]="customUrl" class="col-span-3 !bg-neutral-900 !rounded-r-none"
              placeholder="example.com or http://localhost:8080"/>
       <button (click)="addAndConnectToCustomUrl()" class="!rounded-l-none button-dark"
               [disabled]="selectedServer || customUrl.length<7">Connect
       </button>
     </div>
   </div>

  </div>

  <!-- logo -->
  <div class="flex flex-1 items-center justify-center relative min-w-48">
    <div class="p-4 text-center">
      <img src="/assets/logo/logo.png" alt="onyx logo" class="w-32">
      <h1 style="letter-spacing: 20px" class="font-light">onyx</h1>
    </div>

    <button class="left-2 absolute bottom-2" (click)="contextMenuService.openSettingsMenu(undefined)">
      <lucide-icon [name]="SettingsIcon"></lucide-icon>
    </button>
  </div>

  <p class="absolute right-2 bottom-2 text-neutral-600">
    version {{APP_VERSION}}
  </p>

</div>
