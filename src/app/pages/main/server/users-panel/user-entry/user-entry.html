<div class="grid grid-cols-10">
  <p class="col-span-2">
    <app-profile-image [connection]="connection" [size]="4" [user]="user"></app-profile-image>
    {{ user.username }}
    <br>
  </p>
  <p class="col-span-1">
    @if (user.ban) {
      <svg lucideCircleSlash class="inline h-4"></svg> Banned
    } @else if (user.pendingAccess) {
      <svg lucideUserPlus class="inline h-4"></svg> Pending Access
    } @else {
      <svg lucideUserCheck class="inline  h-4"></svg> Active
    }
  </p>
  <p class="col-span-2">{{ user.knownSince | date: 'medium' }}</p>
  <p class="col-span-2">{{ user.lastSeen | date: 'medium' }}</p>

  <p class="col-span-2">
    @if (groups) {
      <ui-multi-select [(selectedList)]="userGroups" [multi]="true" (onAdded)="addGroup($event)"
                       (onRemoved)="removeGroup($event)">
        @for (group of groups; track group.id) {
          <ui-select-item [label]="group.name" [value]="group"></ui-select-item>
        }
      </ui-multi-select>
    }
  </p>
  <p class="col-span-1">
    @if (user.ban) {
      <button class="!p-1" (click)="unban(user)">
        <svg lucideCircleSlash class="w-3 inline mr-1"></svg>
        Unban
      </button>
    } @else {
      <button class="!p-1 button-red" (click)="ban(user)">
        <svg lucideCircleSlash class="w-3 inline mr-1"></svg>
        Ban
      </button>
    }
  </p>
</div>
