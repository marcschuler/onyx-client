<h3>Server Password</h3>
<div class="settings-grid pb-4">
  <p class="settings-grid-label">Password</p>
  <p class="settings-grid-desc">
    Enter a password if the server should require one to join
    <br>
    @if (connection.data && connection.data.server.settings.password){
      Currently the server is password protected.
    } @else {
      Currently the server has no password.
    }
  </p>
  <input class="settings-grid-option" type="password" placeholder="No password" [(ngModel)]="password">
</div>


<div class="flex justify-end">
  <button class="button-line" (click)="savePassword()">save</button>

</div>
