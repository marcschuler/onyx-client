@if (invites) {
  <div class="list">
    @for (invite of invites; track invite.code) {
      <div class="container">
        <h3>
          <lucide-icon [name]="TicketSlashIcon" class="inline"></lucide-icon>
          {{ invite.title }}
        </h3>
        <p>
          {{ invite.description }}
        </p>
        <div class="grid grid-cols-3">
          <p>Code</p>
          <input type="password" [(ngModel)]="invite.code" min="3" max="32">
          <button class="button-circle">
            <lucide-icon [name]="EyeIcon"></lucide-icon>
          </button>

          <p class="">Starts</p>
          <input type="datetime-local" [(ngModel)]="invite.startDate">
          <button (click)="invite.startDate = undefined">x</button>

          <p class="">Ends</p>
          <input type="datetime-local" [(ngModel)]="invite.endDate">
          <button (click)="invite.endDate = undefined">x</button>

          <p>Usages</p>
          <input type="number" [(ngModel)]="invite.maxUsages">
          <button (click)="invite.maxUsages = undefined">x</button>
        </div>
        @if (invite.maxUsages) {
          <div class="rounded-xl relative pt-4">
            <div class="h-2   rounded-xl absolute bg-neutral-700 w-full"></div>
            <div class="h-2 rounded-xl absolute bg-sky-200"
                 [style.width.%]="Math.min(invite.usages / invite.maxUsages * 100,100)"></div>
            <p class="text-center pt-3">{{ invite.usages }} / {{ invite.maxUsages }} invites used</p>
          </div>
        }

        <button class="button-text">save</button>
        <button class="button-text-red">delete</button>
      </div>
    }
  </div>
} @else {
  <app-spinner></app-spinner>
}
