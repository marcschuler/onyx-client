@if (invites) {
  <div class="list">
    @for (invite of invites; track invite.code) {
      <app-invite-panel [invite]="invite" [invites]="invites" [connection]="connection"></app-invite-panel>
    }
    @if (invites.length==0){
      <h3 class="text-text-faded">No invites there</h3>
    }
  </div>
  <h3 class="pt-4">Create Invite</h3>
  <div class="flex">
    <input [(ngModel)]="code" placeholder="code">
    <input [(ngModel)]="title" placeholder="title">
    <button class="min-w-8" (click)="create()">+</button>
  </div>
} @else {
  <app-spinner></app-spinner>
}
