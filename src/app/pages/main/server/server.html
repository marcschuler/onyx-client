<div class="min-h-screen flex">
  <aside class="hidden md:block w-[200px] min-h-screen shrink-0 bg-neutral-900 border-r-neutral-950 border-r-1">

    <div class="flex flex-col h-screen">
      <app-channel-tree class="flex-1 p-2 overflow-y-auto"></app-channel-tree>
      <app-user-panel ></app-user-panel>
    </div>
  </aside>
  <main class="flex-1">
    @if (webSocketService.connection && webSocketService.connection.currentChannel) {
      <app-channel-view [channelId]="webSocketService.connection.currentChannel"></app-channel-view>
    }
  </main>
</div>
