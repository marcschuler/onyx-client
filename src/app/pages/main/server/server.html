<div class="min-h-screen flex">
  <aside class="block min-h-screen shrink-0 bg-neutral-900 border-r-neutral-950 border-r-1"
         [ngStyle]="{ width: interfaceService.settings.sidebarWidth + 'px' }">
    <div class="flex flex-col h-screen">
      <lucide-icon class="absolute right-2 top-2" [name]="SettingsIcon" (click)="editMode=true"></lucide-icon>
      <app-channel-tree class="flex-1 p-2 overflow-y-auto" [editMode]="editMode"></app-channel-tree>
      <app-user-panel></app-user-panel>
    </div>
  </aside>
  <div
    class="w-1 min-h-full cursor-col-resize bg-neutral-800 hover:bg-neutral-600"
    (mousedown)="startResizing($event)"
  ></div>
  <main class="flex-1">
    @if (webSocketService.connection && webSocketService.connection.currentChannel) {
      <app-channel-view [channelId]="webSocketService.connection.currentChannel"></app-channel-view>
    }
  </main>
</div>
