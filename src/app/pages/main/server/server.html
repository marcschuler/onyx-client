<div class="right-2 top-2 absolute">
  @if (!connection.selectedChannel) {
    <button class="button-dark" (click)="showAdminPanel=true">
      <lucide-icon [name]="ServerCog"></lucide-icon>
    </button>
    <button class="button-dark" (click)="showUsersPanel=true">
      <lucide-icon [name]="BookUser"></lucide-icon>
    </button>
  }
  <button class="button-dark" (click)="closeConnection()">
    <lucide-icon [name]="LogOut"></lucide-icon>
  </button>
</div>
@if (showAdminPanel) {
  <app-popup [closeButton]="true" (close)="showAdminPanel=false">
    <app-admin-panel [connection]="connection"></app-admin-panel>
  </app-popup>
}
@if (showUsersPanel) {
  <app-popup [closeButton]="true" (close)="showUsersPanel=false">
    <app-users-panel [connection]="connection"></app-users-panel>
  </app-popup>
}


<div class="min-h-screen flex">
  <button class="absolute left-2 top-2 z-10 !p-2" (click)="minimized=!minimized">
    @if (minimized) {
      <lucide-icon [name]="PanelLeftOpen" class="w-4"></lucide-icon>
    } @else {
      <lucide-icon [name]="PanelLeftClose" class="w-4"></lucide-icon>
    }
  </button>

  @if (!minimized) {
    <aside class="block min-h-screen mx-h-screen shrink-0 bg-neutral-900 border-r-neutral-950 border-r-1"
           [ngStyle]="{ width: interfaceService.settings.sidebarWidth + 'px' }">
      <div class="flex flex-col h-screen overflow-hidden">
        <div class="flex-1 flex overflow-hidden min-h-0">
          <app-channel-tree class="flex-1 p-2 overflow-y-auto" [connection]="connection"></app-channel-tree>
        </div>
        <div class="flex justify-center shrink-0">
          <div class="w-64">
            <app-user-panel [connection]="connection"></app-user-panel>
          </div>
        </div>
      </div>
    </aside>
    <div
      class="w-0.5 min-h-full cursor-col-resize bg-neutral-800 hover:bg-neutral-600"
      (mousedown)="startResizing($event)"
    ></div>
  }

  <main class="flex-1 max-h-screen">
    @if (connection.selectedChannel) {
      <app-channel-view [connection]="connection" [channelId]="connection.selectedChannel"
                        [titleOffsetLeft]="minimized"></app-channel-view>
    } @else {
      <app-server-overview [connection]="connection"></app-server-overview>
    }
  </main>
</div>
