<div class="max-h-full overflow-auto relative">

  <button (click)="closeConnection()" class="absolute right-4 top-4">
    <svg lucideLogOut class="pr-1"></svg>
    Leave Server
  </button>

  <div class="flex flex-col gap-2 items-center pt-8">
    @if (connection.server.info.icon) {
      <app-preview-image class="block w-48 h-48 rounded-xl overflow-hidden"
                         [file]="connection.server.info.icon"
                         sizes="192px"
                         [connection]="connection"></app-preview-image>
    }
    <h2>{{ connection.server.info.name }}</h2>
  </div>

  <div class="flex flex-col gap-2 justify-center  items-center pt-12">
    @for (description of connection.server.info.description; track description) {
      <div class="p-6 bg-neutral-800 rounded w-9/12">
        <app-message-content [content]="description" [connection]="connection"></app-message-content>
      </div>
    }
  </div>
</div>
