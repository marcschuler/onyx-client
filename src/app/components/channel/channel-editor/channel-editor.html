<app-button-panel [buttons]="[BUTTON_GENERAL]" [(selectedOption)]="selectedOption">

  @switch (selectedOption) {
    @case (BUTTON_GENERAL) {
      <input placeholder="name">
      <textarea placeholder="description"></textarea>
    }
  }
  <div>
    <button (click)="save()">
      <lucide-icon [name]="SaveIcon"></lucide-icon>
    </button>
  </div>
</app-button-panel>
