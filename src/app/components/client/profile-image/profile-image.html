@if (user.avatarId) {
  <app-preview-image [file]="user.avatarId" [connection]="connection"
                     [imageClass]="'rounded inline object-cover w-' + size + ' h-' + size">
  </app-preview-image>
} @else {
  <img alt="user avatar"
       [src]="user.id | identicon: 32 | async"
       class="rounded inline"
  />
}
