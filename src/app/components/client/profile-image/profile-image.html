@if (user.avatarId) {
  <app-preview-image class="block w-full h-full"
                     [file]="user.avatarId"
                     [connection]="connection"
                     [sizes]="sizePx + 'px'">
  </app-preview-image>
} @else {
  <img alt="user avatar"
       [src]="user.id | identicon: sizePx | async"
       class="w-full h-full object-cover"
  />
}
