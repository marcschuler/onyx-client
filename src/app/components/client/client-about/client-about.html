<div class="max-w-64 rounded border">
  <app-profile-image [connection]="connection" [user]="user" [size]="64"></app-profile-image>
  <h1 class="text-center">{{ user.username }}</h1>

  <div class="flex justify-center">
    @for (group of user.groups; track group.id) {
      <app-chip>{{ group.name }}</app-chip>
    }
  </div>

  <h3>ID</h3>
  <app-key-visualizer [keyId]="user.id"></app-key-visualizer>
  <p class="overflow-ellipsis">Key: {{ user.id | slice: 0:18 }}...</p>

  @if (client?.channel) {
    @let channel = connection.channel(client!.channel!);
    @if (channel) {
      <h3 class="pt-4">
        <svg lucideHexagon class="inline w-4"></svg>
        {{ channel.name }}
      </h3>
    }
  }

</div>
