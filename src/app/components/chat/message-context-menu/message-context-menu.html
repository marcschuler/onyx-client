<app-context-menu>
  <app-context-menu-button [icon]="CornerDownRightIcon" (click)="reply()">Reply</app-context-menu-button>
  <app-context-menu-button [icon]="XIcon" (click)="delete()">Delete</app-context-menu-button>

  @if (attachments.length > 0) {
    <ui-split-panel-divider></ui-split-panel-divider>
    @for (file of attachments; track attachments) {
      @if (!file) {
        error:  {{ file | json }}
      } @else {
        <app-context-menu-button [icon]="DownloadIcon">
          <a [href]="file.id | storageFileURL:connection"
             target="_blank">
            {{ file.filename }} ({{ file.size | fileSize }})
          </a>
        </app-context-menu-button>
      }

    }
  }
</app-context-menu>
