<div
  class="rounded gap-2 grid grid-cols-8 w-full rounded-l-none items-center
          D   hover:bg-neutral-900 animate-default group cursor-pointer"
  [class.p-2]="!interfaceService.settings.compactMode"
  [ngClass]="{
          'border-l-onyx-600 border-l-3': connection.me.channel === channel.id,
          'bg-neutral-900': connection.selectedChannel === channel.id
  }" (click)="selectChannel(channel)"
  (contextmenu)="contextMenuService.openChannelContextMenu(channel,connection,$event)">
  <div class="col-span-5   rounded-l-md select-none text-nowrap">
    <svg lucideHexagon class="inline-flex"></svg>
    {{ channel.name }}
  </div>

  @if (channel.voiceMode !== 'NONE') {
    <svg [lucideIcon]="voiceIcon(channel)" class="col-start-6 col-end-7 text-neutral-800 inline py-1"></svg>
  }

  @if (channel.chatMode !== 'NONE') {
    <svg [lucideIcon]="chatIcon(channel)" class="col-start-7 col-end-8 text-neutral-800 inline py-1"></svg>
  }
  <div class="col-start-8 col-end-9">

    @if (connection.me.channel !== channel.id) {
      @if (channel.voiceMode !== "NONE") {
        <button class="button-simpletext-onyx
                    pointer-events-none hoverable
                    group-hover:pointer-events-auto
                    transition"
                (click)="joinChannel(channel)">
          <svg lucideLogIn></svg>
        </button>
      } @else {
        <!-- when not allowed, don't show the button -->
        <span class="px-4"></span>
      }
    } @else if (connection.me.channel === channel.id) {
      <button class="button-simpletext-onyx" (click)="leaveChannel()">
        <svg lucideLogOut></svg>
      </button>
    }
  </div>
</div>
