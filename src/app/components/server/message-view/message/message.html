<div class="pt-1" [ngClass]="{
'pt-1': !useHeader,
'pt-3': useHeader}">
  <!-- TODO -->
  <div class="flex">
    @if (useHeader) {
      <img class="inline rounded max-w-6 max-h-6 mr-2 mt-1" [src]="message.user.id | identicon:32 | async"
           alt="Key ID: {{message.user.id}}"/>

    } @else {
      <div class="mr-2 w-6"></div>
    }

    <div class="bg-neutral-800 px-4 py-2.5 rounded w-fit">
      @if (useHeader) {
        <p class="text-emerald-600 font-bold">
          {{ message.user.username }}
        </p>
      }

      @for (content of message.content; track content) {
        <p [innerHTML]=" content.text | markdown"></p>
      }
      <p class="pl-8 text-sm text-right text-neutral-700">{{ message.timestamp | userDate }}</p>
    </div>

  </div>
</div>
