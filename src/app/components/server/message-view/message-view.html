<div class="h-full flex flex-col pt-4 bg-neutral-900">
  <!-- Scrollable messages -->
  <div #messageList class="flex-grow overflow-auto p-4 relative">
    @if (currentPage && currentPage > 0) {
      <button #moreMessages class="w-full text-center mx-auto block" (click)="loadMessages()">Load more messages</button>
    }
    @for (msg of messages; track msg) {
      @let useHeader = ($index == 0 || messages[$index - 1].user.id != msg.user.id);
      <app-message [message]="msg" [useHeader]="useHeader" [connection]="connection"></app-message>
    }
  </div>

  <!-- Input row pinned to bottom -->
  <div class="bg-neutral-800">
    <div class="grid pt-1">
      <app-file-upload class="max-w-8" [connection]="connection" (uploaded)="onFileUpload($event)" [ghost]="false"></app-file-upload>
    </div>
    <div class="flex items-center">
    <textarea [(ngModel)]="message" (keydown.enter)="sendMessage()"
              class="flex-grow !p-1 h-12 max-h-16 !rounded-none !bg-neutral-800"
    ></textarea>
      <button
        (click)="sendMessage()"
        class="h-12 !rounded-l-none" [disabled]="message.length==0">
        <lucide-icon [name]="SendIcon"></lucide-icon>
      </button>
    </div>
  </div>
</div>
