<div class="h-full flex flex-col">
  <!-- Scrollable messages -->
  <div class="flex-grow overflow-auto p-4">
    <p class="text-neutral-400">
      <lucide-icon class="text-neutral-400 mb-2 w-16 h-16" [name]="BrushCleaningIcon"></lucide-icon>
      Nothing here
    </p>
  </div>

  <!-- Input row pinned to bottom -->
  <div class="flex items-center p-2">
    <textarea [(ngModel)]="message" class="flex-grow !p-1 h-12 max-h-16 !rounded-r-none"
    ></textarea>
    <button
      (click)="sendMessage()"
      class="button-hover-dark h-12 !rounded-l-none" [disabled]="message.length==0">
      <lucide-icon [name]="SendIcon"></lucide-icon>
    </button>
  </div>
</div>
