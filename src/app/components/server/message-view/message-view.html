<div class="h-full flex flex-col pt-4">
  <!-- Scrollable messages -->
  <div #messageList class="flex-grow overflow-auto p-4">
    @for (message of messages; track message) {
      <div>
        <p class="text-neutral-300 pt-4">
          {{ message.user.username }}
          <span class="pl-8 text-neutral-700">{{ message.timestamp | date: 'medium' }}</span>
        </p>
        <div class="bg-neutral-800 px-4 py-2.5 rounded inline-flex">
          @for (content of message.content; track content) {
            <p [innerHTML]=" content.text | markdown"></p>
          }
        </div>
      </div>
    }
  </div>

  <!-- Input row pinned to bottom -->
  <div class="flex items-center pt-2">
    <textarea [(ngModel)]="message" (keydown.enter)="sendMessage()"
              class="flex-grow !p-1 h-12 max-h-16 !rounded-r-none"
    ></textarea>
    <button
      (click)="sendMessage()"
      class="button-hover-dark h-12 !rounded-l-none" [disabled]="message.length==0">
      <lucide-icon [name]="SendIcon"></lucide-icon>
    </button>
  </div>
</div>
