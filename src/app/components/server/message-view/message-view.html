<div class="h-full flex flex-col pt-4 bg-neutral-900">
  <!-- Scrollable messages -->
  <div #messageList class="flex-grow overflow-auto p-4 relative">
    @if (currentPage && currentPage > 0) {
      <button #moreMessages class="w-full text-center mx-auto block" (click)="loadMessages()">Load more messages
      </button>
    }
    @for (msg of messages; track msg) {
      <app-message [message]="msg" [lastMessage]="$index!=0?messages[$index]:undefined" [connection]="connection"
                   (onReply)="setReply($event)"></app-message>
    }
    @if (messages.length == 0) {
      <div class="text-center text-neutral-400">
        <p><lucide-icon [name]="GhostIcon" class="mx-auto h-32 w-32"></lucide-icon></p>
        <h1>nothing here</h1>
      </div>
    }

  </div>

  @if (reply) {
    <div class="bg-neutral-800 p-1 ">
      <lucide-icon [name]="CornerDownRightIcon" class="inline h-4"></lucide-icon>
      Reply to
      <button class="button-small button-dark" (click)="setReply(undefined)">
        <lucide-icon [name]="XIcon"></lucide-icon>
      </button>
      <div class="max-h-16 overflow-auto pl-2">
        <app-message-content class="text-neutral-500" [connection]="connection"
                             [content]="reply.content![0]"></app-message-content>
      </div>
    </div>
  }

  <!-- attachments -->
  <div class="flex pb-1 px-4">
  <app-file-upload class="w-8 !hover:bg-neutral-800 inline" [connection]="connection"
                   (uploaded)="onAttachmentUploaded($event)"
                   [ghost]="false"></app-file-upload>
  @for (attachment of attachments; track attachment.id) {
    <app-chip>
      @if (mimeTypeHasImagePreview(attachment.contentType)) {
        <app-preview-image [file]="attachment" [connection]="connection"
                           imageClass="object-contain max-h-4 rounded-xl inline"></app-preview-image>
      }
      {{ attachment.filename }}
      <button class="button-mini bg-transparent" (click)="removeAttachment(attachment)">
        <lucide-icon [name]="XIcon" class="inline" ></lucide-icon>
      </button>
    </app-chip>
  }
  </div>

  <!-- Input row pinned to bottom -->
  <div class="border border-neutral-600 rounded-xl mx-4 mb-2 min-h-16 max-h-30 bg-neutral-800 items-center">
    <div class="flex">
      <textarea [(ngModel)]="message" (keydown.enter)="sendMessage()"
                class="!bg-neutral-800 !border-0"
      ></textarea>
      <div>
        <button
          (click)="sendMessage()"
          class="" [disabled]="message.length===0">
          <lucide-icon [name]="SendIcon"></lucide-icon>
        </button>
      </div>
    </div>
  </div>
</div>
