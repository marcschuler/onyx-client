<div class="border rounded-xl  border-onyx-600 p-1">

  <div class="flex items-center px-2 gap-2">
    <app-profile-image [user]="connection.me.details" [connection]="connection"></app-profile-image>
    <h4>
      {{ connection.me.username }}
      <div>
        <button class="button-small button-dark" (click)="mediaService.changeTrack(TrackType.Microphone)">
          <svg [lucideIcon]="mediaService.sharedStreams[TrackType.Microphone]?LucideMic:LucideMicOff"
               class="w-4"
               [ngClass]="[
    mediaService.sharedStreams[TrackType.Microphone] ? 'text-emerald-600' : 'text-neutral-700'
  ]"></svg>
        </button>
        <button class="button-small button-dark" (click)="mediaService.changeTrack(TrackType.Camera)">
          <svg [lucideIcon]="mediaService.sharedStreams[TrackType.Camera]?LucideVideo:LucideVideoOff"
               class="w-4"
               [ngClass]="[
    mediaService.sharedStreams[TrackType.Camera] ? 'text-emerald-600' : 'text-neutral-700'
  ]"></svg>
        </button>
        <button class="button-small button-dark" (click)="mediaService.changeTrack(TrackType.Screen)">
          <svg [lucideIcon]="mediaService.sharedStreams[TrackType.Screen]?LucideScreenShare:LucideScreenShareOff"
               class="w-4"
               [ngClass]="[
    mediaService.sharedStreams[TrackType.Screen] ? 'text-emerald-600' : 'text-neutral-700'
  ]"></svg>
        </button>
      </div>
    </h4>

    <button class="button-small button-dark ml-auto" (click)="contextMenuService.openSettingsMenu(connection)">
      <svg lucideEllipsis></svg>
    </button>
  </div>
</div>
