<div class="border rounded-xl  border-onyx-600 p-1">

  <div class="flex items-center px-2 gap-2">
    <app-profile-image [user]="connection.me.details" [connection]="connection"></app-profile-image>
    <h4>
      {{ connection.me.username }}
      <div>
        <button class="button-small button-dark">
          <lucide-icon [name]="mediaService.sharedStreams[TrackType.Microphone]?MicIcon:MicOffIcon"
                       class="w-4"
                       [ngClass]="[
    mediaService.sharedStreams[TrackType.Microphone] ? 'text-emerald-600' : 'text-neutral-700'
  ]"
                       (click)="mediaService.changeTrack(TrackType.Microphone)"></lucide-icon>
        </button>
        <button class="button-small button-dark">
          <lucide-icon [name]="mediaService.sharedStreams[TrackType.Camera]?VideoIcon:VideoOffIcon"
                       class="w-4"
                       [ngClass]="[
    mediaService.sharedStreams[TrackType.Camera] ? 'text-emerald-600' : 'text-neutral-700'
  ]"
                       (click)="mediaService.changeTrack(TrackType.Camera)"></lucide-icon>
        </button>
        <button class="button-small button-dark">
          <lucide-icon [name]="mediaService.sharedStreams[TrackType.Screen]?ScreenShareIcon:ScreenShareOffIcon"
                       class="w-4"
                       [ngClass]="[
    mediaService.sharedStreams[TrackType.Screen] ? 'text-emerald-600' : 'text-neutral-700'
  ]"
                       (click)="mediaService.changeTrack(TrackType.Screen)"></lucide-icon>
        </button>
      </div>
    </h4>

    <button class="button-small button-dark ml-auto" (click)="contextMenuService.openSettingsMenu(connection)">
      <lucide-icon [name]="EllipsisIcon"></lucide-icon>
    </button>
  </div>
</div>
