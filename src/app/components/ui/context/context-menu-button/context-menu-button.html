<button cdkMenuItem (click)="onClick($event)" [disabled]="disabled"
        class="w-full flex items-center gap-2 px-3 py-1.5 rounded-none bg-transparent text-left
               disabled:bg-transparent disabled:opacity-50"
        [class.hover:bg-neutral-700]="!danger"
        [class.text-red-400]="danger" [class.hover:bg-red-900/40]="danger">
  @if (icon) {
    <svg class="w-4 h-4 shrink-0" [lucideIcon]="icon"></svg>
  }
  <ng-content></ng-content>
</button>
