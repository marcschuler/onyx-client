<button cdkMenuItem class="w-full" (click)="onClick($event)" [disabled]="disabled">
  @if (icon){
    <svg class="w-5 pr-1" [lucideIcon]="icon"></svg>
  }
  @if (subMenu) {
    <ng-template #contextSubMenu>
      <div cdkMenu>
        <button cdkMenuItem>Sub Action 1</button>
        <button cdkMenuItem>Sub Action 2</button>
      </div>
    </ng-template>
  }
  <ng-content></ng-content>
</button>
