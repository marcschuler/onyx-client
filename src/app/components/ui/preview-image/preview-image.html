<picture class="block w-full h-full">
  <source
    type="image/jpeg"
    [srcset]="
      (file | storageFileURL: connection:basePath:'J64') + ' 64w, ' +
      (file | storageFileURL: connection:basePath:'J256') + ' 256w, ' +
      (file | storageFileURL: connection:basePath:'J1024') + ' 1024w'
    "
    [sizes]="sizes"
  />

  <img
    [src]="file | storageFileURL: connection:basePath:undefined"
    [alt]="fileAlt()"
    loading="lazy"
    class="w-full h-full"
    [class.object-cover]="fit === 'cover'"
    [class.object-contain]="fit === 'contain'"
  />
</picture>
