<div
  class="rounded flex cursor-pointer"
  [class.button-ghost]="ghost"
  (click)="fileInput.click()"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
>

  @if(uploadPercentage!==undefined){
    <app-spinner></app-spinner>
    <p class="text-xs">
      {{uploadPercentage}}%
    </p>
  } @else {
    <lucide-icon [name]="avatar? ImageUpIcon : FileUpIcon" class="w-[100%]"></lucide-icon>
  }


  <input
    type="file"
    (change)="onFileSelected($event)"
    hidden
    #fileInput
  />

</div>
