<div
  class="rounded flex cursor-pointer"
  (click)="fileInput.click()"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
>

  @if (uploadPercentage !== undefined) {
    <app-spinner></app-spinner>
    <p class="text-xs">
      {{ uploadPercentage }}%
    </p>
  } @else {
  }


  <input
    type="file"
    (change)="onFileSelected($event)"
    hidden
    #fileInput
  />

</div>
