<div class="w-96 h-8 p-4">
  @if (bits) {
    <div class="grid grid-cols-32">
      @for (bit of bits; track $index) {
        @if (bit) {
          <div class="w-2 h-2 rounded-full bg-neutral-200"></div>
        } @else {
          <div class="w-2 h-2 rounded-full bg-neutral-700"></div>
        }
      }
    </div>
  }

</div>
