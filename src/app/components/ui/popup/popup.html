@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div
      class="bg-neutral-900 rounded-lg shadow-xl w-full max-w-md p-6 relative">
      <!-- <button
         class="absolute top-3 right-3 text-gray-400 hover:text-gray-600"
         (click)="closeDialog()">
         ✕
       </button>-->

      <!-- Content -->
      @if (title) {
        <h2 class="text-xl font-semibold mb-4">{{ title }}</h2>
      }
      @if (content) {
        <p class="text-neutral-500 mb-6">{{ content }} </p>
      }

      <ng-content></ng-content>

      @if (buttons){
        <div class="flex justify-end gap-2">
          @for (button of buttons; track button){
            <button [ngClass]="getButtonClass(button.type)"
            (click)="onButton(button)">{{button.text}}</button>
          }
        </div>
      }

    </div>
  </div>
}
