<div class="flex justify-center font-sans" ngCombobox readonly>

  <div #origin class="select-trigger relative flex items-center
                          text-neutral-200 bg-neutral-800 border hover:border-sky-300
                          rounded-lg hover:bg-neutral-700 transition-colors w-64">

    <span class="combobox-label absolute left-4 flex items-center gap-3 pointer-events-none">
          <span class="material-symbols-outlined text-xl" translate="no" aria-hidden="true">
            {{ displayIcon() }}
          </span>
          <span class="text-sm">{{ displayValue() }}</span>
        </span>

    <input aria-label="Label dropdown" placeholder="Select a label" ngComboboxInput/>
    <lucide-icon
      [name]="ChevronDownIcon"
      class="arrow-icon absolute right-0 pointer-events-none
         transition-transform duration-150 ease-in-out
         text-sky-300 w-4 h-4">
    </lucide-icon>
  </div>

  <ng-template ngComboboxPopupContainer>
    <ng-template
      [cdkConnectedOverlay]="{ origin, usePopover: 'inline', matchWidth: true }"
      [cdkConnectedOverlayOpen]="true">
      <div class="popup-container mt-2 p-2 rounded-lg overflow-hidden
                      bg-neutral-800
                      border border-sky-600
                      shadow-sm w-full">
        <div ngListbox [multi]="multi"
             class="flex flex-col gap-1 overflow-auto max-h-[10rem]">
          @for (o of option; track o) {
            <div ngOption [value]="getId(o)" [label]="getLabel(o)"
                 class="flex items-center gap-0 px-4 min-h-[2.25rem]
                            rounded-lg cursor-pointer
                            hover:bg-sky-700
                            transition-colors duration-100">

              <!--<span class="material-symbols-outlined text-[0.9rem] pr-4 text-neutral-400"
                    translate="no" aria-hidden="true">
                {{ label }}
              </span>-->
              <span class="flex-1 text-sm text-neutral-200">
                    {{ getLabel(o) }}
                  </span>
              <span class="option-check material-symbols-outlined text-[0.9rem] text-neutral-400"
                    translate="no" aria-hidden="true">
                    check
                  </span>
            </div>
          }
        </div>
      </div>
    </ng-template>
  </ng-template>

</div>
