<div class="flex h-[800px]">
  <aside class="block shrink-0  bg-neutral-900 border-r-neutral-950 border-r-1 max-w-64">
    <div class="flex flex-col rounded">
      @for (button of buttons; track button) {
        <button class="button-dark !rounded-none" (click)="select(button)"
                [disabled]="selectedOption==button">{{ button.name }}
        </button>
      }
    </div>
  </aside>

  <main class="flex-1 px-8 py-4 overflow-y-scroll ">
    @if (showHeader) {
      <h1>{{ selectedOption.name }}</h1>
    }
    <div class="pb-4"></div>
    <ng-content>
    </ng-content>
  </main>

</div>
