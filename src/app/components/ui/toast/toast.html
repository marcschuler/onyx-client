<!-- toast.component.html -->
@if (toastService.toasts.length > 0) {
  <div class="fixed bottom-2 left-1/2 -translate-x-1/2 flex flex-col gap-3 z-50">
    @for (toast of toastService.toasts; track toast) {
      <div
        class="w-128 shadow-md rounded-xl p-2 border-2 transform transition-all"
        [ngClass]="{
         'bg-green-800 border-green-500 text-green-200': toast.type === 'success',
         'bg-blue-800 border-blue-500 text-blue-200': toast.type === 'info',
         'bg-yellow-800 border-yellow-500 text-yellow-200': toast.type === 'warning',
         'bg-red-800 border-red-500 text-red-200': toast.type === 'error'
       }">
        <div class="flex">
          <div class="w-112">
            @if (toast.title) {
              <h4 class="font-semibold">{{ toast.title }}</h4>
            }
            <p class="text-sm">{{ toast.message }}</p>
          </div>
          <div class="border-l p-2" (click)="toastService.dismiss(toast)">
            <lucide-icon [name]="XIcon"></lucide-icon>
          </div>
        </div>
      </div>
    }
  </div>
}
