<!-- toast.component.html -->
@if (toastService.toasts.length > 0) {
  <div class="fixed bottom-2  right-2 flex flex-col gap-3 z-50">
    @for (toast of toastService.toasts; track toast) {
      <div
        class="max-w-xl w-full shadow-md rounded-md p-2 border-l-4 transform transition-all"
        [ngClass]="{
         'bg-green-50 border-green-500 text-green-800': toast.type === 'success',
         'bg-blue-50 border-blue-500 text-blue-800': toast.type === 'info',
         'bg-yellow-50 border-yellow-500 text-yellow-800': toast.type === 'warning',
         'bg-red-50 border-red-500 text-red-800': toast.type === 'error'
       }">
        <div class="flex justify-between items-start">
          <div>
            @if (toast.title) {
              <h4 class="font-semibold">{{ toast.title }}</h4>
            }
            <p class="text-sm">{{ toast.message }}</p>
          </div>
        </div>
      </div>
    }
  </div>
}
