<button class="button-dark w-full" (click)="click()"
        [class.button-dark-selected]="selected"
        [disabled]="selected">
  @if (icon) {
    <lucide-icon [name]="icon" class="inline pr-1"></lucide-icon>
    <span class="pl-2 border-l border-l-neutral-700"></span>
  }
  @if (name){
    <p>{{name}}</p>
  }
  <ng-content></ng-content>
</button>
