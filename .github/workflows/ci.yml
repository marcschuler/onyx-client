name: CI
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Compile & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx ng lint --no-progress
        continue-on-error: true
 #     - name: Unit tests (headless)
 #       run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build (dev smoke-check)
        run: npm run build

  package:
    name: Package — ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-26.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
          fakeroot dpkg \
          libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
          libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 \
          libxdamage1 libxrandr2 libgbm1 libasound2t64
      - name: Install dependencies
        run: npm ci
      - name: Build production + package + make
        run: npm run electron:package
        env:
          NODE_ENV: production
      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: out/make/**/*
          retention-days: 14

  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all distributables
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: false
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
